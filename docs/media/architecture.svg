  <g class="mover">
    <path class="gf" d="M-8,-6.5 L6,0 L-8,6.5 L-4.5,0 z"><animateMotion dur="0.75s" begin="-0.000s" repeatCount="indefinite" rotate="auto"><mpath href="#p5"/></animateMotion></path>
  </g>
  <path class="track g" d="M540 140 V182"/>
  <path id="p6" class="flow g" d="M540 140 V182"/>
  <g class="mover">
    <path class="gf" d="M-8,-6.5 L6,0 L-8,6.5 L-4.5,0 z"><animateMotion dur="0.75s" begin="-0.000s" repeatCount="indefinite" rotate="auto"><mpath href="#p6"/></animateMotion></path>
