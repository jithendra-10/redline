    <path class="gf" d="M-8,-6.5 L6,0 L-8,6.5 L-4.5,0 z"><animateMotion dur="1.5s" begin="-0.750s" repeatCount="indefinite" rotate="auto"><mpath href="#p7"/></animateMotion></path>
  </g>
