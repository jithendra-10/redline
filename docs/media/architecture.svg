  <path id="p10" class="flow g" d="M540 384 V426"/>
  <g class="mover">
    <path class="gf" d="M-8,-6.5 L6,0 L-8,6.5 L-4.5,0 z"><animateMotion dur="0.75s" begin="-0.000s" repeatCount="indefinite" rotate="auto"><mpath href="#p10"/></animateMotion></path>
  </g>
  <path class="track b" d="M626 466 H676"/>
  <path id="p11" class="flow b" d="M626 466 H676"/>
  <g class="mover">
    <path class="bf" d="M-8,-6.5 L6,0 L-8,6.5 L-4.5,0 z"><animateMotion dur="0.75s" begin="-0.000s" repeatCount="indefinite" rotate="auto"><mpath href="#p11"/></animateMotion></path>
  </g>
  <text class="lbl bf" x="627" y="458" style="font-size:10.5px">redacted</text>
  <path class="track b" d="M802 504 V572 H628"/>
  <path id="p12" class="flow b" d="M802 504 V572 H628"/>
  <g class="mover">
    <path class="bf" d="M-8,-6.5 L6,0 L-8,6.5 L-4.5,0 z"><animateMotion dur="1.5s" begin="-0.000s" repeatCount="indefinite" rotate="auto"><mpath href="#p12"/></animateMotion></path>
    <path class="bf" d="M-8,-6.5 L6,0 L-8,6.5 L-4.5,0 z"><animateMotion dur="1.5s" begin="-0.500s" repeatCount="indefinite" rotate="auto"><mpath href="#p12"/></animateMotion></path>
    <path class="bf" d="M-8,-6.5 L6,0 L-8,6.5 L-4.5,0 z"><animateMotion dur="1.5s" begin="-1.000s" repeatCount="indefinite" rotate="auto"><mpath href="#p12"/></animateMotion></path>
  </g>
  <text class="lbl bf" x="648" y="564">reply with placeholders</text>
  <path class="track b" d="M626 326 H676"/>
  <path id="p13" class="flow b slow" d="M626 326 H676"/>
  <g class="mover">
    <path class="bf" d="M-8,-6.5 L6,0 L-8,6.5 L-4.5,0 z"><animateMotion dur="1.5s" begin="-0.000s" repeatCount="indefinite" rotate="auto"><mpath href="#p13"/></animateMotion></path>
    <path class="bf" d="M-8,-6.5 L6,0 L-8,6.5 L-4.5,0 z"><animateMotion dur="1.5s" begin="-0.750s" repeatCount="indefinite" rotate="auto"><mpath href="#p13"/></animateMotion></path>
