<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d">
  <title id="t">How Redline works</title>
  <desc id="d">Animated workflow. Raw text from an AI chat box goes from the content script to an on-device worker, where pattern rules and Gemini Nano (ONLY_ON_DEVICE) replace sensitive details with meaning-preserving placeholders. Only redacted text is sent to the AI chatbot; its reply is re-hydrated locally. Redacted text may go to Gemini in the cloud (PREFER_IN_CLOUD, falling back to Nano) for a re-identification check. Remote Config delivers policy; Firestore receives counts only.</desc>
  <style>
    .bg { fill: #fbf8f0; }
    .zone { fill: #ffffff; stroke: #d9d1bd; stroke-width: 1.5; }
    .zone2 { fill: #f3f0e6; stroke: #d9d1bd; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .node { fill: #ffffff; stroke: #cfc6b0; stroke-width: 1.5; }
    .nano { fill: #e8f5ee; stroke: #1f7a4d; stroke-width: 2; }
    .cloud { fill: #e8eefc; stroke: #1d4ed8; stroke-width: 2; }
    .key { fill: #fff4f5; stroke: #c8102e; stroke-width: 2; }
    .zl { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .12em; fill: #7a7363; }
    .h { font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d1b16; }
    .s { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5f594c; }
    .m { font: 600 12.5px ui-monospace, "Cascadia Code", Menlo, monospace; fill: #1f7a4d; }
    .lbl { font: 700 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .g { stroke: #1f7a4d; } .gf { fill: #1f7a4d; }
    .b { stroke: #1d4ed8; } .bf { fill: #1d4ed8; }
    .y { stroke: #8a8475; } .yf { fill: #8a8475; }
    .track { fill: none; stroke-width: 7; opacity: .13; stroke-linecap: round; }
    .flow { fill: none; stroke-width: 2.6; stroke-dasharray: 8 7; stroke-linecap: round; animation: dash .75s linear infinite; }
    .slow { animation-duration: 1.5s; }
    @keyframes dash { to { stroke-dashoffset: -15; } }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 50% { stroke-width: 4; } }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14130f; }
      .zone { fill: #1d1b16; stroke: #3a362d; }
      .zone2 { fill: #191813; stroke: #3a362d; }
      .node { fill: #24221b; stroke: #403b31; }
      .nano { fill: #15291e; stroke: #5fd39a; }
      .cloud { fill: #18203a; stroke: #8fb0ff; }
      .key { fill: #2c1418; stroke: #ff5468; }
      .zl { fill: #a39d8e; } .h { fill: #f1ede2; } .s { fill: #b5ae9e; } .m { fill: #5fd39a; }
      .g { stroke: #5fd39a; } .gf { fill: #5fd39a; }
      .b { stroke: #8fb0ff; } .bf { fill: #8fb0ff; }
      .y { stroke: #a39d8e; } .yf { fill: #a39d8e; }
      .track { opacity: .2; }
    }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } .mover { display: none; } }
  </style>
  <rect class="bg" width="960" height="640" rx="16"/>
  <rect class="zone" x="16" y="16" width="624" height="608" rx="14"/>
  <text class="zl" x="36" y="44">YOUR LAPTOP · CHROME</text>
  <rect class="zone2" x="660" y="16" width="284" height="608" rx="14"/>
  <text class="zl" x="680" y="44">OUTSIDE THE LAPTOP</text>
  <rect class="node" x="36" y="66" width="180" height="72" rx="11"/>
  <text class="h" x="52" y="95">① You paste / type</text>
  <text class="s" x="52" y="117">ChatGPT · Gemini · Claude</text>
  <rect class="node" x="246" y="66" width="180" height="72" rx="11"/>
  <text class="h" x="262" y="95">② Redline holds it</text>
  <text class="s" x="262" y="117">content script, nothing sent</text>
  <rect class="node" x="456" y="66" width="168" height="72" rx="11"/>
  <text class="h" x="472" y="95">③ On-device worker</text>
  <text class="s" x="472" y="117">Firebase AI Logic</text>
  <rect class="node" x="246" y="186" width="180" height="72" rx="11"/>
  <text class="h" x="262" y="215">Pattern rules</text>
  <text class="s" x="262" y="237">emails · phones · IDs · $</text>
  <rect class="nano pulse" x="456" y="186" width="168" height="72" rx="11"/>
  <text class="h" x="472" y="215">🔒 Gemini Nano</text>
  <text class="m" x="472" y="237">ONLY_ON_DEVICE</text>
  <rect class="key" x="246" y="306" width="378" height="76" rx="11"/>
  <text class="h" x="262" y="335">④ Placeholders that keep meaning</text>
  <text class="m" x="262" y="361">[PERSON_1 · client]  [FINANCIAL_1 · $1M–10M]</text>
  <rect class="node" x="456" y="430" width="168" height="72" rx="11"/>
  <text class="h" x="472" y="459">⑤ Send</text>
  <text class="s" x="472" y="481">the redacted version</text>
  <rect class="node" x="456" y="536" width="168" height="72" rx="11"/>
  <text class="h" x="472" y="565">⑥ Show real names</text>
  <text class="s" x="472" y="587">restored in this tab only</text>
  <rect class="node" x="680" y="66" width="244" height="72" rx="11"/>
  <text class="h" x="696" y="95">Remote Config</text>
  <text class="s" x="696" y="117">org policy, live in seconds</text>
  <rect class="node" x="680" y="176" width="244" height="72" rx="11"/>
  <text class="h" x="696" y="205">Firestore audit log</text>
  <text class="s" x="696" y="227">counts only, never text</text>
  <rect class="cloud" x="680" y="288" width="244" height="106" rx="11"/>
  <text class="h" x="696" y="317">☁ Gemini in the cloud</text>
  <text class="m bf" x="696" y="339">PREFER_IN_CLOUD</text>
  <text class="s" x="696" y="358">re-identification check</text>
  <text class="s" x="696" y="377">falls back to Nano if offline</text>
  <rect class="node" x="680" y="430" width="244" height="72" rx="11"/>
  <text class="h" x="696" y="459">AI chatbot</text>
  <text class="s" x="696" y="481">sees placeholders only</text>
  <text class="zl" x="36" y="214">LEGEND</text>
  <path class="track g" d="M36 240 H92"/>
  <path id="p1" class="flow g" d="M36 240 H92"/>
  <g class="mover">
    <path class="gf" d="M-8,-6.5 L6,0 L-8,6.5 L-4.5,0 z"><animateMotion dur="1.5s" begin="-0.000s" repeatCount="indefinite" rotate="auto"><mpath href="#p1"/></animateMotion></path>
  </g>
  <text class="s" x="102" y="244">raw text, stays here</text>
  <path class="track b" d="M36 270 H92"/>
  <path id="p2" class="flow b slow" d="M36 270 H92"/>
  <g class="mover">
    <path class="bf" d="M-8,-6.5 L6,0 L-8,6.5 L-4.5,0 z"><animateMotion dur="1.5s" begin="-0.000s" repeatCount="indefinite" rotate="auto"><mpath href="#p2"/></animateMotion></path>
  </g>
  <text class="s" x="102" y="274">redacted text only</text>
  <path class="track y" d="M36 300 H92"/>
  <path id="p3" class="flow y slow" d="M36 300 H92"/>
  <g class="mover">
    <path class="yf" d="M-8,-6.5 L6,0 L-8,6.5 L-4.5,0 z"><animateMotion dur="1.5s" begin="-0.000s" repeatCount="indefinite" rotate="auto"><mpath href="#p3"/></animateMotion></path>
  </g>
  <text class="s" x="102" y="304">policy &amp; counts</text>
  <text class="s" x="36" y="358">Patterns are exact and</text>
  <text class="s" x="36" y="376">always win; Nano finds</text>
  <text class="s" x="36" y="394">names, orgs, diagnoses.</text>
  <text class="s" x="36" y="440">The mapping</text>
  <text class="m" x="36" y="460">PERSON_1 → Priya Shah</text>
  <text class="s" x="36" y="480">never leaves the tab.</text>
